<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>오늘의 사주 한 잔</title>
<style>
  :root{
    --green:#1f6b46; --green-d:#155236; --bg:#f5f3ec; --card:#fffdf8;
    --ink:#23241f; --sub:#6f7268; --line:#e6e2d6; --gold:#b08a3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    line-height:1.65; padding:0 0 48px;}
  .wrap{max-width:440px; margin:0 auto; padding:0 18px;}
  header{text-align:center; padding:34px 0 18px;}
  header .han{font-size:13px; letter-spacing:6px; color:var(--gold); font-weight:600;}
  header h1{font-size:25px; margin:6px 0 4px; font-weight:800;}
  header p{margin:0; color:var(--sub); font-size:13.5px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin:14px 0; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  label{display:block; font-size:13px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .field{margin-bottom:15px;}
  input,select{width:100%; padding:13px 12px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); appearance:none;}
  input:focus,select:focus{outline:none; border-color:var(--green);}
  .row{display:flex; gap:10px;}
  .row>div{flex:1;}
  .seg{display:flex; gap:8px;}
  .seg button{flex:1; padding:11px 0; border:1px solid var(--line); background:#fff;
    border-radius:10px; font-size:14px; color:var(--sub); cursor:pointer; font-weight:600;}
  .seg button.on{border-color:var(--green); background:var(--green); color:#fff;}
  .btn{width:100%; padding:15px; font-size:16px; font-weight:800; color:#fff;
    background:var(--green); border:none; border-radius:12px; cursor:pointer;}
  .btn:active{background:var(--green-d);}
  .btn:disabled{opacity:.55;}
  .hint{font-size:12px; color:var(--sub); margin:6px 2px 0;}

  /* 결과 */
  #result{display:none;}
  .saju-card{background:linear-gradient(180deg,#fffdf8,#faf6ec); border:1px solid var(--line);
    border-radius:16px; padding:22px 18px; text-align:center; position:relative;}
  .saju-card .date{font-size:12px; color:var(--sub); letter-spacing:1px;}
  .pillars{display:flex; justify-content:center; gap:10px; margin:14px 0 6px;}
  .pillar{flex:1; max-width:74px;}
  .pillar .hanja{font-size:30px; font-weight:800; color:var(--green-d);
    font-family:"Apple SD Gothic Neo",serif; line-height:1.1;}
  .pillar .role{font-size:11px; color:var(--sub); margin-top:5px;}
  .pillar .kr{font-size:12px; color:var(--ink);}
  .ilgan{margin-top:10px; font-size:13px; color:var(--green-d); font-weight:700;}
  .ohaeng{font-size:12px; color:var(--sub); margin-top:4px;}
  .desc{font-size:15px; margin:16px 2px 4px; white-space:pre-wrap;}

  h2.sec{font-size:14px; color:var(--sub); margin:26px 2px 10px; font-weight:700;}
  .cats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .cat{padding:14px 0; border:1px solid var(--line); background:var(--card); border-radius:12px;
    font-size:14.5px; font-weight:700; color:var(--green-d); cursor:pointer; text-align:center;}
  .cat.on{background:var(--green); color:#fff; border-color:var(--green);}
  .answer{margin-top:14px; min-height:10px;}
  .answer .box{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--green);
    border-radius:12px; padding:16px 16px; font-size:15px; white-space:pre-wrap;}
  .answer .t{font-weight:800; color:var(--green-d); margin-bottom:7px; font-size:14px;}
  .loading{color:var(--sub); font-size:14px; padding:10px 2px;}
  .dot{display:inline-block; animation:b 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes b{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .reset{display:block; margin:22px auto 0; background:none; border:none; color:var(--sub);
    font-size:13px; text-decoration:underline; cursor:pointer;}
  footer{text-align:center; color:var(--sub); font-size:11.5px; margin-top:30px; line-height:1.7;}
  .err{color:#b0413e; font-size:13.5px; padding:10px 2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="han">四 柱 八 字</div>
    <h1>오늘의 사주 한 잔</h1>
    <p>생년월일을 넣으면, 진짜 사주로 풀어드려요</p>
  </header>

  <!-- 입력 -->
  <div class="card" id="form">
    <div class="field">
      <label>이름 <span style="color:var(--sub);font-weight:400">(선택)</span></label>
      <input id="name" type="text" placeholder="닉네임도 좋아요" maxlength="20" />
    </div>
    <div class="field">
      <label>성별 <span style="color:var(--sub);font-weight:400">(선택)</span></label>
      <div class="seg" id="genderSeg">
        <button data-g="남">남</button>
        <button data-g="여">여</button>
        <button data-g="" class="on">선택 안 함</button>
      </div>
    </div>
    <div class="field">
      <label>생년월일 (양력)</label>
      <input id="birth" type="date" min="1920-01-01" />
      <div class="hint">음력만 아는 경우는 음력→양력 변환 후 입력해 주세요.</div>
    </div>
    <div class="field">
      <label>태어난 시간</label>
      <select id="hour">
        <option value="unknown" selected>시간 모름</option>
      </select>
      <div class="hint">시간을 모르면 ‘시간 모름’ 그대로 둬도 돼요.</div>
    </div>
    <button class="btn" id="go">내 사주 보기 →</button>
    <div class="err" id="formErr" style="display:none"></div>
  </div>

  <!-- 결과 -->
  <div id="result">
    <div class="saju-card">
      <div class="date" id="rDate"></div>
      <div class="pillars" id="rPillars"></div>
      <div class="ilgan" id="rIlgan"></div>
      <div class="ohaeng" id="rOhaeng"></div>
      <div class="desc" id="rDesc"></div>
    </div>

    <h2 class="sec">어떤 운이 궁금해요?</h2>
    <div class="cats" id="cats"></div>
    <div class="answer" id="answer"></div>

    <button class="reset" id="reset">처음부터 다시</button>
  </div>

  <footer>
    재미로 보는 콘텐츠예요 · 사주팔자는 한국천문연구원 만세력 기준으로 계산됩니다
  </footer>
</div>

<script>
  // 시간 옵션 채우기 (0~23시 + 시진 안내)
  const sijin = ["子자시","丑축시","丑축시","寅인시","寅인시","卯묘시","卯묘시","辰진시","辰진시","巳사시","巳사시","午오시","午오시","未미시","未미시","申신시","申신시","酉유시","酉유시","戌술시","戌술시","亥해시","亥해시","子자시"];
  const hourSel = document.getElementById('hour');
  for(let h=0; h<24; h++){
    const o = document.createElement('option');
    o.value = h;
    const ampm = h<12 ? '오전' : '오후';
    const h12 = (h%12)===0 ? 12 : h%12;
    o.textContent = `${String(h).padStart(2,'0')}시 (${ampm} ${h12}시·${sijin[h]})`;
    hourSel.appendChild(o);
  }

  // 성별 세그먼트
  let gender = "";
  document.querySelectorAll('#genderSeg button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('#genderSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); gender = b.dataset.g;
    };
  });

  const CATS = ["총운","연애운","결혼운","금전운","직업운","건강운"];
  let payload = null;          // 현재 사용자 입력
  const cache = {};            // 항목별 결과 캐시

  function dots(){ return '<span class="loading">풀이 중<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>'; }

  async function callAPI(section){
    const res = await fetch('/api/reading', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ...payload, section })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '오류가 발생했어요');
    return data;
  }

  // 사주 보기 (기본 묘사)
  document.getElementById('go').onclick = async ()=>{
    const birth = document.getElementById('birth').value;
    const errEl = document.getElementById('formErr');
    errEl.style.display='none';
    if(!birth){ errEl.textContent='생년월일을 입력해 주세요.'; errEl.style.display='block'; return; }
    const [y,m,d] = birth.split('-').map(Number);
    const hv = hourSel.value;
    payload = {
      name: document.getElementById('name').value.trim(),
      gender,
      year:y, month:m, day:d,
      hourUnknown: hv==='unknown',
      hour: hv==='unknown' ? 12 : Number(hv),
      minute: 0,
    };

    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = '사주 푸는 중...';
    try{
      const data = await callAPI('profile');
      renderProfile(data);
      document.getElementById('form').style.display='none';
      document.getElementById('result').style.display='block';
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){
      errEl.textContent = e.message; errEl.style.display='block';
    }finally{
      btn.disabled=false; btn.textContent='내 사주 보기 →';
    }
  };

  function renderProfile(data){
    const s = data.saju;
    const order = ['년주','월주','일주','시주'];
    document.getElementById('rDate').textContent =
      `${payload.year}. ${String(payload.month).padStart(2,'0')}. ${String(payload.day).padStart(2,'0')}`
      + (s.시간보정 ? `  ·  진태양시 ${s.시간보정.hour}:${String(s.시간보정.minute).padStart(2,'0')} 보정` : '');
    document.getElementById('rPillars').innerHTML = order.map(k=>{
      const p = s.pillars[k];
      if(!p) return `<div class="pillar"><div class="hanja" style="color:#cfc9b8">—</div><div class="role">${k}</div><div class="kr">시간 모름</div></div>`;
      return `<div class="pillar"><div class="hanja">${p.hanja}</div><div class="role">${k}</div><div class="kr">${p.hangul}</div></div>`;
    }).join('');
    document.getElementById('rIlgan').textContent =
      `일간 ${s.일간.hangul}${s.일간.hanja} · ${s.일간.오행}(${s.일간.음양})의 기운`;
    const od = s.오행분포;
    document.getElementById('rOhaeng').textContent =
      `오행 ▸ ` + Object.entries(od).map(([k,v])=>`${k} ${v}`).join('  ');
    document.getElementById('rDesc').textContent = data.text;

    // 카테고리 버튼
    const cats = document.getElementById('cats');
    cats.innerHTML = CATS.map(c=>`<button class="cat" data-c="${c}">${c}</button>`).join('');
    cats.querySelectorAll('.cat').forEach(b=> b.onclick = ()=>selectCat(b.dataset.c, b));
    document.getElementById('answer').innerHTML='';
  }

  async function selectCat(cat, btn){
    document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');
    const ans = document.getElementById('answer');

    if(cache[cat]){ ans.innerHTML = answerBox(cat, cache[cat]); return; }
    ans.innerHTML = dots();
    try{
      const data = await callAPI(cat);
      cache[cat] = data.text;
      ans.innerHTML = answerBox(cat, data.text);
    }catch(e){
      ans.innerHTML = `<div class="err">${e.message}</div>`;
    }
  }
  function answerBox(cat, text){
    return `<div class="box"><div class="t">${cat}</div>${text.replace(/</g,'&lt;')}</div>`;
  }

  document.getElementById('reset').onclick = ()=>{
    payload=null; for(const k in cache) delete cache[k];
    document.getElementById('result').style.display='none';
    document.getElementById('form').style.display='block';
    window.scrollTo({top:0, behavior:'smooth'});
  };
</script>
</body>
</html>
